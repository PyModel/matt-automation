    <line x1="374"  y1="242" x2="406"  y2="242"/>
    <line x1="518"  y1="242" x2="550"  y2="242"/>
    <line x1="687"  y1="242" x2="719"  y2="242"/>
    <line x1="849"  y1="242" x2="881"  y2="242"/>
