    <text x="189"  y="247">ask-matt</text>
    <text x="328"  y="247">grill</text>
    <text x="462"  y="247">to-spec</text>
    <text x="618"  y="247">to-tickets</text>
    <text x="784"  y="247">implement</text>
    <text x="954"  y="247">code-review</text>
    <text x="1106" y="247">retro</text>
  </g>

  <g stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)">
