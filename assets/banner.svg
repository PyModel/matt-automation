  <path d="M1106 266 C1106 300, 1060 300, 1000 300 L280 300 C220 300, 189 300, 189 270" fill="none" stroke="#22d3ee" stroke-opacity="0.7" stroke-width="1.5" stroke-dasharray="5 6" marker-end="url(#loop)"/>
  <rect x="540" y="290" width="200" height="20" rx="10" fill="#0f172a"/>
