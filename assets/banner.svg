      <rect x="288"  y="222" width="80"  height="40" rx="20" fill="#a78bfa" stroke="#a78bfa"/>
      <rect x="412"  y="222" width="100" height="40" rx="20" fill="#a78bfa" stroke="#a78bfa"/>
      <rect x="556"  y="222" width="125" height="40" rx="20" fill="#a78bfa" stroke="#a78bfa"/>
      <rect x="725"  y="222" width="118" height="40" rx="20" fill="#22d3ee" stroke="#22d3ee"/>
      <rect x="887"  y="222" width="135" height="40" rx="20" fill="#34d399" stroke="#34d399"/>
      <rect x="1066" y="222" width="80"  height="40" rx="20" fill="#34d399" stroke="#34d399"/>
